<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="user-scalable=no, width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0908">
  <title>Pinball - Polymatic Example</title>
  <style>
    /* the cabinet's wood, for the frame here and the hud's bar (src/shell) */
    :root {
      --wood:
        /* the grain: fine rings, and wider, fainter bands from another centre over them */
        repeating-radial-gradient(ellipse 160% 90% at 12% 8%, rgba(40, 18, 4, 0.24) 0 1px, transparent 1px 10px, rgba(255, 214, 160, 0.05) 10px 11px, transparent 11px 23px),
        repeating-radial-gradient(ellipse 140% 110% at 88% 96%, transparent 0 48px, rgba(30, 12, 2, 0.18) 48px 60px, transparent 60px 112px, rgba(255, 200, 140, 0.06) 112px 120px),
        /* dark walnut, lit from above: the top a little lighter than the bottom */
        linear-gradient(180deg, #5a3417 0%, #3f220d 45%, #2a1607 100%);
      /* its edges: caught by the light on top, in shadow underneath */
      --wood-edge: inset 0 1px 0 rgba(255, 210, 160, 0.18), inset 0 -2px 3px rgba(0, 0, 0, 0.5);
      /* the paper cards' stock and ink, and the Engineer's Plate's */
      --paper: #f1e7cf;
      --ink: #2b2016;
    }
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    /* The room: dark, with a pool of light behind the table in its colour
       (--table-color, set by the hud; registered, so it fades between tables),
       and a faint drifting haze. */
    @property --table-color {
      syntax: "<color>";
      inherits: true;
      initial-value: #b08058;
    }
    :root {
      transition: --table-color 1.2s ease;
    }
    body {
      background:
        /* the corners, darker */
        radial-gradient(ellipse 120% 100% at 50% 45%, transparent 50%, rgba(0, 0, 0, 0.75) 100%),
        /* the light behind the table, in its colour */
        radial-gradient(ellipse 85% 75% at 50% 42%, color-mix(in srgb, var(--table-color) 18%, transparent), transparent 70%),
        /* the room, warm and near black */
        radial-gradient(ellipse 80% 70% at 50% 42%, #1b1613 0%, #0b0908 55%, #030202 100%)
        #030202;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 30% 22% at 32% 38%, color-mix(in srgb, var(--table-color) 20%, rgba(90, 80, 72, 0.1)), transparent 70%),
        radial-gradient(ellipse 28% 22% at 68% 62%, rgba(90, 80, 72, 0.09), transparent 70%),
        radial-gradient(ellipse 34% 18% at 50% 24%, rgba(90, 80, 72, 0.07), transparent 70%);
      opacity: 0.5;
      filter: blur(24px);
      animation: fog-drift 60s ease-in-out infinite alternate;
    }
    @keyframes fog-drift {
      from { transform: translate(-4%, -2%) scale(1); }
      to { transform: translate(4%, 3%) scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }
    /* where the table goes: under the hud's bar, clear of the screen's bottom edge */
    #table-area {
      position: fixed;
      inset: calc(max(8px, env(safe-area-inset-top)) + 58px) 0 max(8px, env(safe-area-inset-bottom)) 0;
      display: flex;
      /* at the top, just under the hud's bar, which is as wide: one cabinet */
      align-items: flex-start;
      justify-content: center;
      container-type: size;
    }
    /* the table, as big as fits, in the drawing's proportions (--table-aspect,
       set by TableView), in a wooden frame */
    #table {
      --frame: clamp(8px, 2.4vmin, 20px);
      --table-aspect: 0.7333;
      box-sizing: content-box;
      width: min(100cqw - 2 * var(--frame), (100cqh - 2 * var(--frame)) * var(--table-aspect));
      aspect-ratio: var(--table-aspect);
      padding: var(--frame);
      border-radius: calc(var(--frame) * 0.8);
      background: var(--wood);
      box-shadow: var(--wood-edge), 0 18px 50px rgba(0, 0, 0, 0.85);
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #table > svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* the frame's shadow on the playfield, most from the top */
    #table::after {
      content: "";
      position: absolute;
      inset: var(--frame);
      pointer-events: none;
      box-shadow:
        inset 0 calc(var(--frame) * 0.45) calc(var(--frame) * 0.8) rgba(0, 0, 0, 0.7),
        inset 0 0 calc(var(--frame) * 0.5) rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="table-area"><div id="table"></div></div>
  <!-- the preact hud, over the table: see src/shell -->
  <div id="ui-root"></div>
  <script type="module" src="./src/index.tsx"></script>
</body>
</html>
